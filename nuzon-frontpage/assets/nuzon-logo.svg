<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" role="img" aria-label="Nuzon BV — Zonnepanelen">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd45e"/>
      <stop offset="1" stop-color="#e6ad2e"/>
    </linearGradient>
  </defs>
  <!-- Zon -->
  <g transform="translate(48 48)">
    <g fill="none" stroke="url(#sun)" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-40" x2="0" y2="-28"/>
      <line x1="0" y1="40" x2="0" y2="28"/>
      <line x1="-40" y1="0" x2="-28" y2="0"/>
      <line x1="40" y1="0" x2="28" y2="0"/>
      <line x1="-28.3" y1="-28.3" x2="-19.8" y2="-19.8"/>
      <line x1="28.3" y1="28.3" x2="19.8" y2="19.8"/>
      <line x1="28.3" y1="-28.3" x2="19.8" y2="-19.8"/>
      <line x1="-28.3" y1="28.3" x2="-19.8" y2="19.8"/>
    </g>
    <circle r="22" fill="url(#sun)"/>
    <text x="0" y="6" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="800" fill="#3a2a14" text-anchor="middle">NU</text>
  </g>
  <!-- Wordmark -->
  <text x="92" y="56" font-family="Sora, Arial, sans-serif" font-size="42" font-weight="800" fill="#8a5a2b" letter-spacing="-1">nuzon</text>
  <text x="232" y="56" font-family="Sora, Arial, sans-serif" font-size="16" font-weight="700" fill="#b88514">BV</text>
  <text x="93" y="78" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#3a2a14" letter-spacing="3">ZONNEPANELEN</text>
